services:
    deploy:
        image: deploy
        build:
            context: .
            dockerfile: Dockerfile
            target: deploy
        depends_on:
            db:
                condition: service_healthy
    mssmbot:
        image: mssmbot
        build:
            context: .
            dockerfile: Dockerfile
            target: mssmbot
        restart: unless-stopped
        depends_on:
            deploy:
                condition: service_completed_successfully
        volumes:
            - memory:/mssm/memory
    db:
        image: postgres:18
        restart: unless-stopped
        hostname: postgres_db
        shm_size: 128mb
        environment:
            - POSTGRES_DB=mssm
            - POSTGRES_USER=mssm
            - POSTGRES_PASSWORD=mssm
        expose:
            - 5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mssm -d mssm"]
            interval: 5s
            timeout: 2s
            retries: 20
        volumes:
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:
    memory: